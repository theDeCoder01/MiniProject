name: Deploy

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

env:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
jobs:
  Deployment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
        working-directory: ["app"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ matrix.working-directory }}

      - name: lint with flake8
        run: |
          pip install flake8
          flake8 . --format='::warning file=%(path)s,line=%(row)d,col=%(col)d::[Flake8] %(code)s: %(text)s' --exit-zero
        working-directory: ${{ matrix.working-directory }}
        #force flake 8 to code 0 while still echoing the errors.

      - name: run tests with pytest
        run: |
            pip install pytest pytest-cov
            python -m pytest tests/ --cov=main --cov=business_logic --cov-report=term-missing --cov-report=xml:coverage_api.xml --junitxml=pytest-results.xml
        working-directory: ${{ matrix.working-directory }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            sudo -u todoapi git -C /opt/todo-api/MiniProject pull --ff-only
            sudo -u todoapi /opt/todo-api/venv/bin/pip install -r /opt/todo-api/MiniProject/app/requirements.txt
            sudo systemctl restart todo-api.service
          '

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:5000/health"; then
              echo ""
              echo "App is healthy ✅"
              exit 0
            fi
            echo "Waiting for app to come up... ($i/10)"
            sleep 5
          done
          echo "Health check failed ❌"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment succeeded — app is live at http://${{ secrets.EC2_HOST }}:5000"
            echo "### ✅ Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Deployment failed — check the logs above"
            echo "### ❌ Deployment failed" >> "$GITHUB_STEP_SUMMARY"
          fi
